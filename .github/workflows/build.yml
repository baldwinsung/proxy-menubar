name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: xcodebuild (unsigned)
        run: |
          xcodebuild -project SimpleProxyMenuBar.xcodeproj -scheme SimpleProxyMenuBar \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
